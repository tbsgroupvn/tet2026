<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="tbs-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33bbff;stop-opacity:1" />
    </linearGradient>
    <clipPath id="text-clip">
      <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="160" letter-spacing="8">TBS</text>
    </clipPath>
  </defs>
  <!-- Speed lines through TBS text -->
  <g clip-path="url(#text-clip)">
    <rect x="0" y="0" width="400" height="300" fill="url(#tbs-grad)"/>
    <!-- Horizontal speed lines -->
    <line x1="30" y1="68" x2="370" y2="68" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="78" x2="370" y2="78" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="88" x2="370" y2="88" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="98" x2="370" y2="98" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="108" x2="370" y2="108" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="118" x2="370" y2="118" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="128" x2="370" y2="128" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="138" x2="370" y2="138" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="148" x2="370" y2="148" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="158" x2="370" y2="158" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="168" x2="370" y2="168" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="178" x2="370" y2="178" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="188" x2="370" y2="188" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="198" x2="370" y2="198" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="208" x2="370" y2="208" stroke="white" stroke-width="2.5" opacity="0.5"/>
    <line x1="30" y1="218" x2="370" y2="218" stroke="white" stroke-width="2" opacity="0.4"/>
    <!-- Speed line tails extending right -->
    <line x1="350" y1="88" x2="390" y2="85" stroke="url(#tbs-grad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="350" y1="108" x2="395" y2="106" stroke="url(#tbs-grad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="340" y1="128" x2="385" y2="126" stroke="url(#tbs-grad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="350" y1="148" x2="390" y2="147" stroke="url(#tbs-grad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="345" y1="168" x2="392" y2="167" stroke="url(#tbs-grad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="350" y1="188" x2="388" y2="187" stroke="url(#tbs-grad)" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- GROUP text -->
  <text x="50%" y="88%" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="#0099ff" letter-spacing="12">GROUP</text>
</svg>
